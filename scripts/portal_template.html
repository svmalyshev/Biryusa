</style></head><body><div class="app">
<aside class="panel left"><header class="head"><h1>Бирюса · образцы</h1><div id="total" class="muted"></div></header><div class="filters"><input id="search" type="search" placeholder="Номер или описание" aria-label="Поиск образцов"><div class="years"><label><input id="year2024" type="checkbox" checked><i class="dot"></i>2024</label><label><input id="year2025" type="checkbox" checked><i class="dot y25"></i>2025</label></div></div><div id="count" class="count"></div><div id="list" class="list"></div></aside>
<main class="map-wrap"><canvas id="map" aria-label="Карта точек отбора образцов Бирюсы" tabindex="0"></canvas><div class="toolbar"><button id="zoomIn" title="Приблизить">+</button><button id="zoomOut" title="Отдалить">−</button><button id="fit">Все точки</button><button id="labels" aria-pressed="true">Подписи</button><button id="satellite" aria-pressed="true">Спутник Google</button></div><div id="mapLayers" class="map-layers" role="group" aria-label="Управление геологическими картами"><div class="map-layers-heading"><span>Карты</span><span>Прозрачность</span></div><div id="layers"></div></div><div id="popup" class="popup"></div><div id="mapStatus" class="map-status" role="status"></div><div class="map-credit">Спутник: Google · Геологические карты: материалы проекта</div></main>
<aside class="panel right"><div id="detail" class="detail"><div class="eyebrow">Карточка образца</div><h2>Выберите точку</h2><p class="muted">Нажмите на маркер или номер образца в списке.</p></div></aside>
</div><script>
'use strict';
const SAMPLES=__SAMPLES__,LAYERS=__LAYERS__;
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),popup=document.getElementById('popup'),tileCache=new Map(),hits=[];
let dpr=window.devicePixelRatio||1,zoom=10,center={lat:54.5,lon:98.4},active=null,showLabels=true,showSatellite=true,frame=0;
let selectedYears=new Set([2024,2025]);
const colours={2024:'#227a6b',2025:'#b76c26'};
const layers=LAYERS.map(layer=>{const tileRanges={};layer.tiles.forEach(([z,x,y])=>{const r=tileRanges[z]||(tileRanges[z]={x0:x,x1:x,y0:y,y1:y});r.x0=Math.min(r.x0,x);r.x1=Math.max(r.x1,x);r.y0=Math.min(r.y0,y);r.y1=Math.max(r.y1,y);});return {...layer,tileSet:new Set(layer.tiles.map(t=>t.join('/'))),tileRanges};});
try{const saved=JSON.parse(localStorage.getItem('biryusa-map-layers')||'null');if(saved)layers.forEach(l=>{const s=saved[l.id];if(s&&typeof s.enabled==='boolean'&&Number.isFinite(s.transparency)){l.enabled=s.enabled;l.transparency=Math.max(0,Math.min(100,s.transparency));}});}catch(e){}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function project(lat,lon,z){const n=256*2**z,s=Math.sin(lat*Math.PI/180);return{x:(lon+180)/360*n,y:(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n};}
function unproject(x,y,z){const n=256*2**z;return{lon:x/n*360-180,lat:180/Math.PI*Math.atan(Math.sinh(Math.PI-2*Math.PI*y/n))};}
function screen(lat,lon){const p=project(lat,lon,zoom),c=project(center.lat,center.lon,zoom);return{x:canvas.width/2+(p.x-c.x)*dpr,y:canvas.height/2+(p.y-c.y)*dpr};}
function redraw(){if(!frame)frame=requestAnimationFrame(()=>{frame=0;draw();});}
function imageTile(key,url){let entry=tileCache.get(key);if(entry){tileCache.delete(key);tileCache.set(key,entry);return entry;}const img=new Image();entry={img,loaded:false,failed:false};img.onload=()=>{entry.loaded=true;redraw();};img.onerror=()=>{entry.failed=true;if(key.startsWith('sat/'))document.getElementById('mapStatus').textContent='Спутниковые снимки недоступны. Для подложки Google требуется подключение к интернету.';else document.getElementById('mapStatus').textContent='Не удалось загрузить фрагмент карты. Проверьте папку maps.';redraw();};tileCache.set(key,entry);img.src=url;while(tileCache.size>250)tileCache.delete(tileCache.keys().next().value);return entry;}
function tileWindow(z){const factor=2**(zoom-z),p=project(center.lat,center.lon,z),w=canvas.width/(dpr*factor),h=canvas.height/(dpr*factor);return{factor,left:p.x-w/2,top:p.y-h/2,x0:Math.floor((p.x-w/2)/256),x1:Math.floor((p.x+w/2)/256),y0:Math.floor((p.y-h/2)/256),y1:Math.floor((p.y+h/2)/256)};}
function drawLayer(layer){if(!layer.enabled||layer.transparency>=100)return;const available=Object.keys(layer.tileRanges).map(Number),desired=Math.floor(zoom),z=available.reduce((best,z)=>Math.abs(z-desired)<Math.abs(best-desired)?z:best,available[0]),v=tileWindow(z),size=256*dpr*v.factor,r=layer.tileRanges[z];ctx.save();ctx.globalAlpha=1-layer.transparency/100;for(let y=Math.max(v.y0,r.y0);y<=Math.min(v.y1,r.y1);y++)for(let x=Math.max(v.x0,r.x0);x<=Math.min(v.x1,r.x1);x++){if(!layer.tileSet.has(`${z}/${x}/${y}`))continue;const url=layer.template.replace('{z}',z).replace('{x}',x).replace('{y}',y),e=imageTile(layer.id+'/'+z+'/'+x+'/'+y,url);if(e.loaded)ctx.drawImage(e.img,(x*256-v.left)*dpr*v.factor,(y*256-v.top)*dpr*v.factor,size,size);}ctx.restore();}
function filtered(){const q=document.getElementById('search').value.trim().toLowerCase();return SAMPLES.filter(s=>selectedYears.has(s.year)&&(!q||[s.sample,s.description,s.analysis].join(' ').toLowerCase().includes(q)));}
function groupSamples(arr){const groups=new Map();arr.forEach(s=>{const key=`${s.lat.toFixed(7)},${s.lon.toFixed(7)}`;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(s);});return [...groups.values()];}
function draw(){if(!canvas.width)return;ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#26352e';ctx.fillRect(0,0,canvas.width,canvas.height);if(showSatellite){const z=Math.max(0,Math.min(19,Math.floor(zoom))),v=tileWindow(z),size=256*dpr*v.factor;for(let y=v.y0;y<=v.y1;y++)for(let x=v.x0;x<=v.x1;x++){if(y<0||y>=2**z)continue;const wx=((x%2**z)+2**z)%2**z,e=imageTile(`sat/${z}/${wx}/${y}`,`https://mt1.google.com/vt/lyrs=s&x=${wx}&y=${y}&z=${z}`);if(e.loaded)ctx.drawImage(e.img,(x*256-v.left)*dpr*v.factor,(y*256-v.top)*dpr*v.factor,size+.5,size+.5);}}layers.forEach(drawLayer);hits.length=0;for(const group of groupSamples(filtered())){const s=group[0],p=screen(s.lat,s.lon),on=group.some(x=>x.sample===active),r=(on?8:6)*dpr;if(p.x<-30||p.x>canvas.width+30||p.y<-30||p.y>canvas.height+30)continue;ctx.save();ctx.fillStyle=colours[s.year];ctx.strokeStyle=on?'#ffdd70':'white';ctx.lineWidth=(on?3:1.6)*dpr;ctx.shadowColor='#0009';ctx.shadowBlur=4*dpr;ctx.beginPath();if(s.year===2024)ctx.arc(p.x,p.y,r,0,Math.PI*2);else{ctx.moveTo(p.x,p.y-r-1*dpr);ctx.lineTo(p.x+r+1*dpr,p.y);ctx.lineTo(p.x,p.y+r+1*dpr);ctx.lineTo(p.x-r-1*dpr,p.y);ctx.closePath();}ctx.fill();ctx.stroke();ctx.shadowBlur=0;if(showLabels){ctx.font=`700 ${11*dpr}px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial`;ctx.lineJoin='round';ctx.lineWidth=3*dpr;ctx.strokeStyle='#13241fee';ctx.strokeText(s.point_id,p.x+11*dpr,p.y-8*dpr);ctx.fillStyle='white';ctx.fillText(s.point_id,p.x+11*dpr,p.y-8*dpr);}ctx.restore();hits.push({x:p.x,y:p.y,r:14*dpr,group});}canvas.dataset.zoom=zoom.toFixed(3);}
function resize(){const r=canvas.getBoundingClientRect();dpr=window.devicePixelRatio||1;canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));popup.classList.remove('visible');redraw();}
function fit(arr=filtered()){if(!arr.length)return;const lat=arr.map(s=>s.lat),lon=arr.map(s=>s.lon),n=Math.max(...lat),s=Math.min(...lat),e=Math.max(...lon),w=Math.min(...lon);const a=project(n,w,0),b=project(s,e,0);center=unproject((a.x+b.x)/2,(a.y+b.y)/2,0);const dx=Math.max(.00001,b.x-a.x),dy=Math.max(.00001,b.y-a.y);zoom=Math.max(3,Math.min(16,Math.log2(Math.min(canvas.width/dpr*.74/dx,canvas.height/dpr*.72/dy))));popup.classList.remove('visible');redraw();}
function list(){const arr=filtered();document.getElementById('count').textContent=`Показано ${arr.length} из ${SAMPLES.length} образцов`;document.getElementById('list').innerHTML=arr.map(s=>`<button class="item ${s.sample===active?'active':''}" data-sample="${esc(s.sample)}"><b><i class="dot ${s.year===2025?'y25':''}"></i>${esc(s.sample)}</b><small>${esc(s.description)}</small></button>`).join('')||'<div class="empty">По фильтрам ничего не найдено</div>';document.querySelectorAll('.item').forEach(b=>b.onclick=()=>openSample(b.dataset.sample,true));redraw();}
function field(label,value){return value?`<div class="field"><b>${esc(label)}</b><p>${esc(value)}</p></div>`:'';}
function openSample(id,pan=false){const s=SAMPLES.find(s=>s.sample===id);if(!s)return;active=id;popup.classList.remove('visible');document.getElementById('detail').innerHTML=`<div class="eyebrow">Карточка образца · ${s.year}</div><h2>${esc(s.sample)}</h2>${field('Объект / полевое описание',s.description)}${field('План работ по каталогу',s.analysis)}<div class="field coordinates"><b>Координаты WGS 84</b><p>${s.lat.toFixed(6)}, ${s.lon.toFixed(6)}</p><p class="muted">${esc(s.position_raw)}</p></div>${s.campaign_note?`<details><summary>Примечание к кампании ${s.year}</summary><p class="muted">${esc(s.campaign_note)}</p></details>`:''}<div class="field"><b>Источник координат и описания</b><p class="muted">${esc(s.source)} · страница ${s.source_page}. Номер сохранён по полевому каталогу.</p></div><div class="detail-links"><a href="${esc(s.source_url)}" target="_blank" rel="noopener">Открыть каталог</a><button id="focusSample">Показать на карте</button></div>`;document.getElementById('focusSample').onclick=()=>{center={lat:s.lat,lon:s.lon};zoom=Math.max(zoom,13);redraw();};if(pan){center={lat:s.lat,lon:s.lon};zoom=Math.max(zoom,12);}list();}
function choose(hits,x,y){const choices=hits.flatMap(h=>h.group),seen=new Set(),rows=choices.filter(s=>!seen.has(s.sample)&&seen.add(s.sample));if(rows.length===1){openSample(rows[0].sample);return;}popup.innerHTML='<strong>Выберите образец</strong>'+rows.map(s=>`<button data-sample="${esc(s.sample)}"><b>${esc(s.sample)}</b> · ${s.year}<br><small>${esc(s.description)}</small></button>`).join('');popup.style.left=Math.max(8,Math.min(x/dpr+12,canvas.clientWidth-292))+'px';popup.style.top=Math.max(65,Math.min(y/dpr+12,canvas.clientHeight-Math.min(330,75+rows.length*62)))+'px';popup.style.maxHeight=Math.max(120,canvas.clientHeight-85)+'px';popup.style.overflowY='auto';popup.classList.add('visible');popup.querySelectorAll('button').forEach(b=>b.onclick=()=>openSample(b.dataset.sample));}
function zoomAt(delta,x=canvas.width/2,y=canvas.height/2){const c=project(center.lat,center.lon,zoom),anchor=unproject(c.x+(x-canvas.width/2)/dpr,c.y+(y-canvas.height/2)/dpr,zoom);zoom=Math.max(3,Math.min(19,zoom+delta));const p=project(anchor.lat,anchor.lon,zoom);center=unproject(p.x-(x-canvas.width/2)/dpr,p.y-(y-canvas.height/2)/dpr,zoom);popup.classList.remove('visible');redraw();}
function renderLayers(){document.getElementById('layers').innerHTML=layers.map(l=>`<div class="layer ${l.enabled?'':'inactive'}" id="layer-${l.id}"><button class="layer-toggle" data-layer="${l.id}" aria-pressed="${l.enabled}" aria-label="${esc(l.name)}" title="${esc(l.name)} · нажмите, чтобы включить или отключить">${esc(l.id==='field2025'?'Комплект 2025':l.name.split(' ·')[0])}</button><input id="alpha-${l.id}" data-alpha="${l.id}" type="range" min="0" max="100" step="1" value="${l.transparency}" ${l.enabled?'':'disabled'} aria-label="Прозрачность слоя ${esc(l.name)}" title="Прозрачность: ${l.transparency}%"><output id="value-${l.id}" for="alpha-${l.id}">${l.transparency}%</output></div>`).join('');document.querySelectorAll('[data-layer]').forEach(el=>el.onclick=()=>{const l=layers.find(l=>l.id===el.dataset.layer);l.enabled=!l.enabled;el.setAttribute('aria-pressed',String(l.enabled));document.getElementById('layer-'+l.id).classList.toggle('inactive',!l.enabled);document.getElementById('alpha-'+l.id).disabled=!l.enabled;saveLayers();redraw();});document.querySelectorAll('[data-alpha]').forEach(el=>el.oninput=()=>{layers.find(l=>l.id===el.dataset.alpha).transparency=Number(el.value);document.getElementById('value-'+el.dataset.alpha).textContent=el.value+'%';el.title='Прозрачность: '+el.value+'%';saveLayers();redraw();});}
function saveLayers(){try{localStorage.setItem('biryusa-map-layers',JSON.stringify(Object.fromEntries(layers.map(l=>[l.id,{enabled:l.enabled,transparency:l.transparency}]))));}catch(e){}}
const pointers=new Map();let gesture=null,dragged=false;
function resetGesture(){const p=[...pointers.values()];gesture={zoom,center:{...center},p:p.map(v=>({...v})),distance:p.length===2?Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y):0};}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1)dragged=false;else dragged=true;resetGesture();canvas.classList.add('dragging');});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const p=[...pointers.values()];if(p.length===1){const dx=p[0].x-gesture.p[0].x,dy=p[0].y-gesture.p[0].y;if(Math.hypot(dx,dy)>3)dragged=true;const c=project(gesture.center.lat,gesture.center.lon,gesture.zoom);center=unproject(c.x-dx,c.y-dy,gesture.zoom);}else if(p.length===2&&gesture.distance>0){const rect=canvas.getBoundingClientRect(),oldx=(gesture.p[0].x+gesture.p[1].x)/2-rect.left,oldy=(gesture.p[0].y+gesture.p[1].y)/2-rect.top,newx=(p[0].x+p[1].x)/2-rect.left,newy=(p[0].y+p[1].y)/2-rect.top,c=project(gesture.center.lat,gesture.center.lon,gesture.zoom),anchor=unproject(c.x+oldx-canvas.clientWidth/2,c.y+oldy-canvas.clientHeight/2,gesture.zoom);zoom=Math.max(3,Math.min(19,gesture.zoom+Math.log2(Math.hypot(p[1].x-p[0].x,p[1].y-p[0].y)/gesture.distance)));const a=project(anchor.lat,anchor.lon,zoom);center=unproject(a.x-newx+canvas.clientWidth/2,a.y-newy+canvas.clientHeight/2,zoom);}popup.classList.remove('visible');redraw();});
function endPointer(e){pointers.delete(e.pointerId);if(pointers.size){resetGesture();return;}canvas.classList.remove('dragging');if(dragged||e.type==='pointercancel')return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*dpr,y=(e.clientY-rect.top)*dpr,hit=[...hits].reverse().find(h=>Math.hypot(h.x-x,h.y-y)<=h.r);if(hit)choose(hits.filter(h=>Math.hypot(h.x-hit.x,h.y-hit.y)<=30*dpr),x,y);else popup.classList.remove('visible');}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect(),units=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*120:e.deltaY;zoomAt(Math.max(-.4,Math.min(.4,-units*(e.ctrlKey?.035:.008))),(e.clientX-r.left)*dpr,(e.clientY-r.top)*dpr);},{passive:false});
canvas.addEventListener('keydown',e=>{if(['+','=','-','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(e.key==='+'||e.key==='=')zoomAt(.5);else if(e.key==='-')zoomAt(-.5);else{const c=project(center.lat,center.lon,zoom);center=unproject(c.x+(e.key==='ArrowRight'?70:e.key==='ArrowLeft'?-70:0),c.y+(e.key==='ArrowDown'?70:e.key==='ArrowUp'?-70:0),zoom);redraw();}}if(e.key==='Escape')popup.classList.remove('visible');});
document.getElementById('zoomIn').onclick=()=>zoomAt(.5);document.getElementById('zoomOut').onclick=()=>zoomAt(-.5);document.getElementById('fit').onclick=()=>fit();document.getElementById('labels').onclick=e=>{showLabels=!showLabels;e.target.setAttribute('aria-pressed',String(showLabels));redraw();};document.getElementById('satellite').onclick=e=>{showSatellite=!showSatellite;e.target.setAttribute('aria-pressed',String(showSatellite));document.getElementById('mapStatus').textContent='';redraw();};document.getElementById('search').oninput=()=>{popup.classList.remove('visible');list();fit();};[2024,2025].forEach(year=>document.getElementById('year'+year).onchange=e=>{if(e.target.checked)selectedYears.add(year);else selectedYears.delete(year);list();fit();});
document.getElementById('total').textContent=`${SAMPLES.length} образцов · ${groupSamples(SAMPLES).length} точек отбора`;renderLayers();resize();list();fit();const fromUrl=new URLSearchParams(location.search).get('sample');if(fromUrl&&SAMPLES.some(s=>s.sample===fromUrl))openSample(fromUrl,true);if(typeof ResizeObserver!=='undefined')new ResizeObserver(resize).observe(canvas.parentElement);else window.addEventListener('resize',resize);
</script></body></html>
